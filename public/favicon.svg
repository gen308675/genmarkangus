<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Ambient Neon Aura -->
  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.2" filter="url(#glow)"/>
  
  <!-- Main Emblem -->
  <g filter="url(#glow)">
    
          <!-- Neural Network Nodes & Core -->
          <path d="M 256,128 L 368,210 L 328,348 L 184,348 L 144,210 Z" fill="none" stroke="#10b981" stroke-width="12" stroke-linejoin="round" opacity="0.4"/>
          <path d="M 256,128 L 256,256 M 368,210 L 256,256 M 328,348 L 256,256 M 184,348 L 256,256 M 144,210 L 256,256" stroke="#06b6d4" stroke-width="10" stroke-linecap="round"/>
          <circle cx="256" cy="256" r="32" fill="#10b981"/>
          <circle cx="256" cy="128" r="20" fill="#06b6d4"/>
          <circle cx="368" cy="210" r="20" fill="#10b981"/>
          <circle cx="328" cy="348" r="20" fill="#06b6d4"/>
          <circle cx="184" cy="348" r="20" fill="#10b981"/>
          <circle cx="144" cy="210" r="20" fill="#06b6d4"/>
          <circle cx="256" cy="256" r="12" fill="#ffffff"/>
        
  </g>
</svg>